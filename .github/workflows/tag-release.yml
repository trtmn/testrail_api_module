name: Tag and release on merge to main

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Get version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" \
              >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.tag_check.outputs.exists }}

  deploy-docs:
    name: Build and deploy documentation
    needs: tag
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate documentation
        run: uv run python utilities/generate_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    name: Build and publish to PyPI
    needs: deploy-docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: uv pip install --system --upgrade build twine

      - name: Clean previous builds
        run: rm -rf dist/ build/ *.egg-info

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  github-release:
    name: Create GitHub release
    needs: [tag, publish]
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at the new tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.tag.outputs.version }}

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
              flag && /^## \[/         { exit }
              flag                     { print }
            ' CHANGELOG.md
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "pip install testrail-api-module==$VERSION"
            echo '```'
            echo ""
            echo "## Full changelog"
            echo ""
            echo "See [CHANGELOG.md](https://github.com/$REPO/blob/v$VERSION/CHANGELOG.md) and the [PyPI page](https://pypi.org/project/testrail-api-module/$VERSION/)."
          } > /tmp/release_notes.md
          echo "--- Generated release notes ---"
          cat /tmp/release_notes.md

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release_notes.md \
            --repo "$REPO"
